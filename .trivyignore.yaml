# Waivers para o gate de PR do Trivy (.github/workflows/security-trivy.yml, job
# `trivy-fs-pr-gate`) e para o scan de imagem em produção (.github/workflows/production.yaml).
#
# Fonte de verdade única de POR QUÊ um advisory é aceito, dono e data de reavaliação:
# docs/security/AUDIT_WAIVERS.md ("## Waivers ativos"). Este arquivo só espelha o(s) mesmo(s)
# advisory ID(s) no formato que o Trivy entende, com o `expired_at` correspondente — quando
# `docs/security/AUDIT_WAIVERS.md` mudar (nova entrada, expiração, remoção), atualize este arquivo
# na mesma alteração. `expired_at` vencido faz o Trivy voltar a reportar o achado normalmente
# (fail-closed automático, não depende de revisão manual notar a data vencida).
#
# Poda 2026-11-24 (Agente 99 — Vito, DEM-20261123-001): removidas 37 entradas comprovadamente
# obsoletas. Evidência: `npm audit --audit-level=high` = 0 high/critical; versões resolvidas nos
# lockfiles scaneados (raiz, agente-codigo-local, landing) acima do range vulnerável de cada
# advisory — ver docs/security/AUDIT_WAIVERS.md (Histórico) e
# .agents/runs/squads/squad-90-run-99-waivers.md. Único waiver remanescente: picomatch
# (CVE-2026-112366 ainda afeta 4.0.7, última versão publicada, sem patch upstream).
vulnerabilities:
  - id: GHSA-FC5Q-39XC-VJPF
    expired_at: 2026-12-17
    statement: >-
      picomatch <=4.0.7 ReDoS em ferramentas de build/lint/test sem versão de patch publicada upstream. Ver docs/security/AUDIT_WAIVERS.md.
  - id: GHSA-fc5q-39xc-vjpf
    expired_at: 2026-12-17
    statement: >-
      picomatch <=4.0.7 ReDoS em ferramentas de build/lint/test sem versão de patch publicada upstream. Ver docs/security/AUDIT_WAIVERS.md.
  - id: CVE-2026-112366
    expired_at: 2026-12-17
    statement: >-
      Mesma vulnerabilidade de GHSA-FC5Q-39XC-VJPF (picomatch <=4.0.7 ReDoS em ferramentas de build/lint/test), sob o CVE ID usado pelo Trivy. Ver docs/security/AUDIT_WAIVERS.md.
