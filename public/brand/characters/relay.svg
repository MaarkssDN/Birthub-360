<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="relay-title relay-desc">
  <title id="relay-title">Relay — Coordenador Comercial</title>
  <desc id="relay-desc">Avatar não-humano representando Relay: nó hexagonal de roteamento com três rotas luminosas de distribuição de trabalho.</desc>
  <defs>
    <radialGradient id="relay-core-grad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#CCFBF1"/>
      <stop offset="45%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </radialGradient>
    <linearGradient id="relay-path-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFC107" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="relay-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="relay-halo-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="46" fill="#2DD4BF" fill-opacity="0.14" filter="url(#relay-halo-blur)"/>

  <!-- Rotas de distribuição (3 direções) -->
  <g stroke="url(#relay-path-grad)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#relay-glow)">
    <path d="M 64 64 L 30 38"/>
    <path d="M 64 64 L 98 38"/>
    <path d="M 64 64 L 64 102"/>
  </g>

  <!-- Nós de destino -->
  <circle cx="30" cy="38" r="6" fill="#0D0D0D" stroke="#00D4FF" stroke-width="2.4" filter="url(#relay-glow)"/>
  <circle cx="98" cy="38" r="6" fill="#0D0D0D" stroke="#FF2D9B" stroke-width="2.4" filter="url(#relay-glow)"/>
  <circle cx="64" cy="102" r="6" fill="#0D0D0D" stroke="#FFC107" stroke-width="2.4" filter="url(#relay-glow)"/>
  <circle cx="30" cy="38" r="2" fill="#00D4FF"/>
  <circle cx="98" cy="38" r="2" fill="#FF2D9B"/>
  <circle cx="64" cy="102" r="2" fill="#FFC107"/>

  <!-- Hub central hexagonal -->
  <polygon points="64,40 82,52 82,76 64,88 46,76 46,52" fill="url(#relay-core-grad)" filter="url(#relay-glow)"/>
  <polygon points="64,48 76,55 76,73 64,80 52,73 52,55" fill="#0D0D0D" fill-opacity="0.5"/>
  <circle cx="64" cy="64" r="6" fill="#CCFBF1"/>
  <circle cx="64" cy="64" r="3" fill="#0F766E"/>
</svg>
