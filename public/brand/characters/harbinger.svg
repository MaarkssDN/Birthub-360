<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="harbinger-title harbinger-desc">
  <title id="harbinger-title">Harbinger — Oráculo de Receita</title>
  <desc id="harbinger-desc">Avatar não-humano representando Harbinger: cristal preditivo facetado com seta de tendência ascendente e base de projeção.</desc>
  <defs>
    <linearGradient id="harbinger-gem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="45%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="harbinger-trend-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#FF2D9B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFC107" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="harbinger-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="harbinger-halo-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="46" fill="#C084FC" fill-opacity="0.14" filter="url(#harbinger-halo-blur)"/>

  <!-- Base de projeção -->
  <path d="M 44 98 H 84 L 78 90 H 50 Z" fill="#0D0D0D" stroke="#C084FC" stroke-width="1.8"/>
  <rect x="56" y="88" width="16" height="5" rx="2" fill="#1A1A22" stroke="#00D4FF" stroke-width="1.4"/>

  <!-- Cristal facetado -->
  <g filter="url(#harbinger-glow)">
    <path d="M 64 30 L 86 52 L 76 88 L 52 88 L 42 52 Z" fill="url(#harbinger-gem-grad)"/>
    <path d="M 64 30 L 64 88 M 42 52 L 86 52 M 52 88 L 64 52 L 76 88" stroke="#E9D5FF" stroke-width="1.2" opacity="0.55" fill="none"/>
  </g>

  <!-- Setas de tendência (3 pontos ascendentes) -->
  <g stroke="url(#harbinger-trend-grad)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#harbinger-glow)">
    <path d="M 50 74 L 58 64 L 66 56 L 78 42"/>
  </g>
  <path d="M 70 42 L 80 42 L 80 32" stroke="#FFC107" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#harbinger-glow)"/>

  <!-- Núcleo preditivo -->
  <circle cx="64" cy="60" r="7" fill="#0D0D0D" stroke="#E9D5FF" stroke-width="2"/>
  <circle cx="62" cy="58" r="2.4" fill="#C084FC"/>
</svg>
