<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="tracker-title tracker-desc">
  <title id="tracker-title">Tracker — Hunter de Novas Contas</title>
  <desc id="tracker-desc">Avatar não-humano representando Tracker: radar de varredura com quadrantes, feixe de rastreio e alvos detectados.</desc>
  <defs>
    <radialGradient id="tracker-core-grad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FEE2E2"/>
      <stop offset="45%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
    <linearGradient id="tracker-sweep-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#FFC107" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="tracker-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="tracker-halo-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="46" fill="#F87171" fill-opacity="0.13" filter="url(#tracker-halo-blur)"/>

  <!-- Quadrantes do radar -->
  <circle cx="64" cy="64" r="38" stroke="url(#tracker-sweep-grad)" stroke-width="3" fill="none" filter="url(#tracker-glow)"/>
  <circle cx="64" cy="64" r="26" stroke="#F87171" stroke-width="1.4" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="64" cy="64" r="14" stroke="#FFC107" stroke-width="1.4" opacity="0.7"/>
  <line x1="64" y1="26" x2="64" y2="102" stroke="#F87171" stroke-width="1.2" opacity="0.5"/>
  <line x1="26" y1="64" x2="102" y2="64" stroke="#F87171" stroke-width="1.2" opacity="0.5"/>

  <!-- Feixe de varredura -->
  <path d="M 64 64 L 96 40 A 38 38 0 0 1 96 88 Z" fill="#FFC107" fill-opacity="0.18"/>
  <line x1="64" y1="64" x2="96" y2="40" stroke="#FFC107" stroke-width="2.6" stroke-linecap="round" filter="url(#tracker-glow)"/>

  <!-- Alvos detectados -->
  <g filter="url(#tracker-glow)">
    <circle cx="86" cy="52" r="4" fill="#00D4FF"/>
    <circle cx="78" cy="80" r="3.4" fill="#FF2D9B"/>
    <circle cx="92" cy="74" r="2.6" fill="#10B981"/>
  </g>

  <!-- Centro do radar -->
  <circle cx="64" cy="64" r="9" fill="url(#tracker-core-grad)" filter="url(#tracker-glow)"/>
  <circle cx="64" cy="64" r="3.4" fill="#0D0D0D"/>
  <circle cx="62" cy="62" r="1.4" fill="#FEE2E2"/>
</svg>
