<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="vanguard-title vanguard-desc">
  <title id="vanguard-title">Vanguard — Estrategista de Metas</title>
  <desc id="vanguard-desc">Avatar não-humano representando Vanguard: ponta de lança e chevron ascendente em rosa neon e dourado, simbolizando superação de metas e performance.</desc>
  <defs>
    <linearGradient id="vanguard-blade-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D9B"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="vanguard-blade-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="vanguard-gold-core" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="vanguard-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="vanguard-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur2"/>
    </filter>
  </defs>

  <!-- Halo de Fundo -->
  <polygon points="64,12 110,92 64,80 18,92" fill="#FF2D9B" fill-opacity="0.16" filter="url(#vanguard-halo)"/>

  <!-- Asas / Chevrons Traseiros de Aceleração -->
  <path d="M 64 24 L 98 84 L 64 74 L 30 84 Z" fill="url(#vanguard-blade-2)" opacity="0.45"/>
  <path d="M 64 36 L 108 98 L 64 88 L 20 98 Z" stroke="#FF2D9B" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- Corpo Principal da Lança Vanguard (Chevron Dianteiro) -->
  <g filter="url(#vanguard-glow)">
    <!-- Asa Esquerda -->
    <polygon points="64,16 64,82 26,88" fill="url(#vanguard-blade-1)"/>
    <!-- Asa Direita -->
    <polygon points="64,16 102,88 64,82" fill="url(#vanguard-blade-2)"/>
  </g>

  <!-- Crista Frontal Refletiva -->
  <line x1="64" y1="16" x2="64" y2="82" stroke="#FFF1F2" stroke-width="2" filter="url(#vanguard-glow)"/>

  <!-- Núcleo de Propulsão / Ponto Focal de Meta (Dourado Neon) -->
  <polygon points="64,48 74,68 64,64 54,68" fill="url(#vanguard-gold-core)" filter="url(#vanguard-glow)"/>
  <circle cx="64" cy="58" r="2.5" fill="#FFFFFF"/>

  <!-- Propulsor de Energia Inferior -->
  <polygon points="64,82 72,112 64,104 56,112" fill="#00D4FF" opacity="0.9" filter="url(#vanguard-glow)"/>
  <circle cx="64" cy="94" r="2" fill="#BAE6FD"/>

  <!-- Vetores Laterais de Impulso -->
  <line x1="26" y1="88" x2="16" y2="100" stroke="#FF2D9B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="16" cy="100" r="2" fill="#FFC107"/>

  <line x1="102" y1="88" x2="112" y2="100" stroke="#FF2D9B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="112" cy="100" r="2" fill="#FFC107"/>

  <!-- Mira Vetorial de Topo -->
  <circle cx="64" cy="16" r="3" fill="#FFF1F2" filter="url(#vanguard-glow)"/>
</svg>