<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="meridian-title meridian-desc">
  <title id="meridian-title">Meridian — Qualificação SDR</title>
  <desc id="meridian-desc">Avatar não-humano representando Meridian: bússola de qualificação com anel graduado, agulha de decisão e lente central.</desc>
  <defs>
    <radialGradient id="meridian-core-grad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="45%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
    <linearGradient id="meridian-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#8B7DFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="meridian-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="meridian-halo-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="46" fill="#34D399" fill-opacity="0.14" filter="url(#meridian-halo-blur)"/>

  <!-- Anel externo graduado -->
  <circle cx="64" cy="64" r="42" stroke="url(#meridian-ring-grad)" stroke-width="3" filter="url(#meridian-glow)"/>
  <circle cx="64" cy="64" r="36" stroke="#8B7DFF" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.6"/>

  <!-- Ticks cardeais -->
  <g stroke="#34D399" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <line x1="64" y1="24" x2="64" y2="32"/>
    <line x1="64" y1="96" x2="64" y2="104"/>
    <line x1="24" y1="64" x2="32" y2="64"/>
    <line x1="96" y1="64" x2="104" y2="64"/>
  </g>

  <!-- Meridiano elíptico interno -->
  <ellipse cx="64" cy="64" rx="30" ry="14" transform="rotate(-20 64 64)" stroke="#8B7DFF" stroke-width="1.6" fill="none" opacity="0.8"/>

  <!-- Agulha de decisão (losango) -->
  <g filter="url(#meridian-glow)">
    <path d="M 64 44 L 71 64 L 64 84 L 57 64 Z" fill="url(#meridian-core-grad)"/>
    <path d="M 64 44 L 71 64 L 64 84" fill="none" stroke="#D1FAE5" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Lente/pivô central -->
  <circle cx="64" cy="64" r="6" fill="#0D0D0D" stroke="#34D399" stroke-width="2"/>
  <circle cx="62" cy="62" r="2" fill="#34D399"/>

  <!-- Marcadores de score -->
  <circle cx="64" cy="24" r="2.6" fill="#00D4FF"/>
  <circle cx="104" cy="64" r="2.6" fill="#FFC107"/>
  <circle cx="24" cy="64" r="2.6" fill="#FF2D9B"/>
</svg>
