<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birth Hub 360º | Central de Comando Inteligente</title>
    <meta
      name="description"
      content="Ecossistema inteligente que conecta dados, IA, automações e processos e transforma o que está disperso em direção clara para a sua operação comercial."
    />
    <meta name="theme-color" content="#0D0D0D" />
    <link rel="icon" type="image/svg+xml" href="/brand/birthhub360-icone.svg" />
    <script>
      (() => {
        try {
          const t = localStorage.getItem('birthhub_theme');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch {}
      })();
    </script>
    <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
