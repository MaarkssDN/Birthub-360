<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="oracle-title oracle-desc">
  <title id="oracle-title">Oracle — Visionário de Forecast</title>
  <desc id="oracle-desc">Avatar não-humano representando Oracle: astrolábio ocular quântico em púrpura e rosa neon, simbolizando previsibilidade de forecast e visão temporal.</desc>
  <defs>
    <linearGradient id="oracle-ring-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <radialGradient id="oracle-iris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D9B"/>
      <stop offset="45%" stop-color="#9333EA"/>
      <stop offset="85%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </radialGradient>
    <radialGradient id="oracle-pupil" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
    <filter id="oracle-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="oracle-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur2"/>
    </filter>
  </defs>

  <!-- Halo de Fundo -->
  <circle cx="64" cy="64" r="48" fill="#A855F7" fill-opacity="0.18" filter="url(#oracle-halo)"/>

  <!-- Anel Temporal Externo com Marcadores (Timeline Ring) -->
  <circle cx="64" cy="64" r="52" stroke="url(#oracle-ring-1)" stroke-width="2" stroke-dasharray="3 7"/>
  <circle cx="64" cy="64" r="44" stroke="#FF2D9B" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Marcadores Cardeais de Previsão -->
  <line x1="64" y1="8" x2="64" y2="16" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="64" y1="112" x2="64" y2="120" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="64" x2="16" y2="64" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="112" y1="64" x2="120" y2="64" stroke="#00D4FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Lente Ocular Losangular (Silhueta Astrolábica) -->
  <g filter="url(#oracle-glow)">
    <path d="M 18 64 Q 64 26, 110 64 Q 64 102, 18 64 Z" stroke="url(#oracle-ring-1)" stroke-width="3" fill="#0D0D0D" fill-opacity="0.85"/>
  </g>

  <!-- Íris Quântica com Gradiente Cósmico -->
  <circle cx="64" cy="64" r="26" fill="url(#oracle-iris)" stroke="#FF2D9B" stroke-width="1.5" filter="url(#oracle-glow)"/>

  <!-- Retículo / Ponto Focal Temporal -->
  <circle cx="64" cy="64" r="18" stroke="#F472B6" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Pupila Preditiva / Estrela do Futuro -->
  <circle cx="64" cy="64" r="11" fill="url(#oracle-pupil)" filter="url(#oracle-glow)"/>
  <circle cx="61" cy="61" r="3" fill="#FFFFFF"/>

  <!-- Feixes Horizontais de Varredura de Forecast -->
  <line x1="28" y1="64" x2="48" y2="64" stroke="#00D4FF" stroke-width="1.5" opacity="0.8"/>
  <line x1="80" y1="64" x2="100" y2="64" stroke="#00D4FF" stroke-width="1.5" opacity="0.8"/>

  <!-- Satélites de Confiança (Probability Dots) -->
  <circle cx="34" cy="38" r="3" fill="#FFC107" filter="url(#oracle-glow)"/>
  <circle cx="94" cy="38" r="3" fill="#00D4FF" filter="url(#oracle-glow)"/>
  <circle cx="94" cy="90" r="3" fill="#FF2D9B" filter="url(#oracle-glow)"/>
</svg>