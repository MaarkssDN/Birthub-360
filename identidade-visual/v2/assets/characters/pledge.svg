<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="pledge-title pledge-desc">
  <title id="pledge-title">Pledge — Guardião de Promessas</title>
  <desc id="pledge-desc">Avatar não-humano representando Pledge: laço de compromisso entrelaçado com nó central de fidelidade e extremos selados.</desc>
  <defs>
    <linearGradient id="pledge-loop-a-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9A8D4" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#8B7DFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFC107" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="pledge-loop-b-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#8B7DFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F9A8D4" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="pledge-knot-grad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FDF2F8"/>
      <stop offset="45%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </radialGradient>
    <filter id="pledge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="pledge-halo-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="46" fill="#F9A8D4" fill-opacity="0.14" filter="url(#pledge-halo-blur)"/>

  <!-- Laço esquerdo -->
  <path d="M 64 64 C 44 40 26 52 34 70 C 40 84 58 78 64 64" stroke="url(#pledge-loop-a-grad)" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#pledge-glow)"/>
  <!-- Laço direito -->
  <path d="M 64 64 C 84 40 102 52 94 70 C 88 84 70 78 64 64" stroke="url(#pledge-loop-b-grad)" stroke-width="9" stroke-linecap="round" fill="none" filter="url(#pledge-glow)"/>

  <!-- Extremos selados -->
  <g filter="url(#pledge-glow)">
    <circle cx="32" cy="74" r="7" fill="#0D0D0D" stroke="#F9A8D4" stroke-width="2.6"/>
    <circle cx="96" cy="74" r="7" fill="#0D0D0D" stroke="#FFC107" stroke-width="2.6"/>
    <circle cx="32" cy="74" r="2.4" fill="#F9A8D4"/>
    <circle cx="96" cy="74" r="2.4" fill="#FFC107"/>
  </g>

  <!-- Nó central de fidelidade -->
  <circle cx="64" cy="64" r="15" fill="url(#pledge-knot-grad)" filter="url(#pledge-glow)"/>
  <path d="M 58 64 L 63 69 L 71 58" stroke="#0D0D0D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="64" cy="64" r="3.4" fill="#FFC107"/>
</svg>
