<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="aegis-title aegis-desc">
  <title id="aegis-title">Aegis — Supervisor Central</title>
  <desc id="aegis-desc">Avatar não-humano representando Aegis: escudo de orquestração com íris central e anel de comando sobre todos os agentes.</desc>
  <defs>
    <linearGradient id="aegis-shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="45%" stop-color="#8B7DFF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="aegis-iris-grad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="45%" stop-color="#8B7DFF"/>
      <stop offset="100%" stop-color="#312E81"/>
    </radialGradient>
    <linearGradient id="aegis-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#8B7DFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="aegis-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="aegis-halo-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="46" fill="#8B7DFF" fill-opacity="0.15" filter="url(#aegis-halo-blur)"/>

  <!-- Anel de comando orbital -->
  <ellipse cx="64" cy="64" rx="48" ry="17" transform="rotate(-24 64 64)" stroke="url(#aegis-ring-grad)" stroke-width="2.6" fill="none" opacity="0.7" filter="url(#aegis-glow)"/>

  <!-- Escudo -->
  <path d="M 64 26 L 92 40 V 62 C 92 80 80 92 64 100 C 48 92 36 80 36 62 V 40 Z" fill="url(#aegis-shield-grad)" filter="url(#aegis-glow)"/>
  <path d="M 64 26 L 92 40 V 62 C 92 80 80 92 64 100 C 48 92 36 80 36 62 V 40 Z" fill="none" stroke="#E0E7FF" stroke-width="1.4" opacity="0.55"/>

  <!-- Íris central do supervisor -->
  <circle cx="64" cy="60" r="17" fill="url(#aegis-iris-grad)"/>
  <circle cx="64" cy="60" r="17" fill="none" stroke="#FFC107" stroke-width="2" opacity="0.85"/>
  <circle cx="64" cy="60" r="8" fill="#0D0D0D"/>
  <circle cx="61" cy="57" r="3" fill="#8B7DFF"/>
  <circle cx="67" cy="63" r="1.8" fill="#00D4FF"/>

  <!-- Marcadores de subordinação -->
  <g fill="#FFC107" filter="url(#aegis-glow)">
    <circle cx="50" cy="38" r="2.6"/>
    <circle cx="78" cy="38" r="2.6"/>
    <circle cx="92" cy="52" r="2.2"/>
    <circle cx="36" cy="52" r="2.2"/>
  </g>
</svg>
