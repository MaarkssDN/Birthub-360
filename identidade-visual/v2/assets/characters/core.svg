<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="core-title core-desc">
  <title id="core-title">Core — Mente Principal</title>
  <desc id="core-desc">Avatar não-humano representando Core: orbe neural hiperdimensional em índigo, ciano e rosa neon, simbolizando cognição e orquestração de IA.</desc>
  <defs>
    <radialGradient id="core-sphere-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="30%" stop-color="#6366F1"/>
      <stop offset="70%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
    <linearGradient id="core-synapse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#FF2D9B"/>
    </linearGradient>
    <filter id="core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="core-halo" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="11" result="blur2"/>
    </filter>
  </defs>

  <!-- Halo de Fundo Índigo e Rosa -->
  <circle cx="64" cy="64" r="50" fill="#6366F1" fill-opacity="0.22" filter="url(#core-halo)"/>

  <!-- Sinapses Neurais Radiantes (Teia Externa) -->
  <g stroke="url(#core-synapse-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="64" y1="64" x2="20" y2="28"/>
    <line x1="64" y1="64" x2="108" y2="28"/>
    <line x1="64" y1="64" x2="114" y2="76"/>
    <line x1="64" y1="64" x2="64" y2="116"/>
    <line x1="64" y1="64" x2="14" y2="76"/>
  </g>

  <!-- Anéis Poligonais Neurais (Geometria Sagrada de IA) -->
  <polygon points="64,16 106,40 106,88 64,112 22,88 22,40" stroke="#00D4FF" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.45"/>
  <polygon points="64,24 99,44 99,84 64,104 29,84 29,44" stroke="#FF2D9B" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>

  <!-- Orbe Neural Central -->
  <circle cx="64" cy="64" r="30" fill="url(#core-sphere-grad)" filter="url(#core-glow)"/>

  <!-- Padrões Sinápticos Internos -->
  <path d="M 46 54 Q 64 42, 82 54 Q 74 74, 64 64 Q 54 74, 46 54 Z" fill="none" stroke="#BAE6FD" stroke-width="1.5" stroke-linecap="round" opacity="0.75" filter="url(#core-glow)"/>
  
  <!-- Núcleo de Processamento Quântico (Cristal Central) -->
  <polygon points="64,50 74,58 74,70 64,78 54,70 54,58" fill="#0D0D0D" stroke="#00D4FF" stroke-width="2" filter="url(#core-glow)"/>
  <circle cx="64" cy="64" r="4.5" fill="#00D4FF" filter="url(#core-glow)"/>
  <circle cx="62" cy="62" r="1.5" fill="#FFFFFF"/>

  <!-- Nodos Sinápticos de Terminação (Botões de IA) -->
  <circle cx="20" cy="28" r="4" fill="#00D4FF" filter="url(#core-glow)"/>
  <circle cx="20" cy="28" r="1.5" fill="#FFFFFF"/>

  <circle cx="108" cy="28" r="4" fill="#FF2D9B" filter="url(#core-glow)"/>
  <circle cx="108" cy="28" r="1.5" fill="#FFFFFF"/>

  <circle cx="114" cy="76" r="3.5" fill="#FFC107" filter="url(#core-glow)"/>

  <circle cx="64" cy="116" r="4" fill="#00D4FF" filter="url(#core-glow)"/>
  <circle cx="64" cy="116" r="1.5" fill="#FFFFFF"/>

  <circle cx="14" cy="76" r="3.5" fill="#6366F1" filter="url(#core-glow)"/>
</svg>