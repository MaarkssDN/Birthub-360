<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="spark-title spark-desc">
  <title id="spark-title">Spark — Engenheiro de Integrações</title>
  <desc id="spark-desc">Avatar não-humano representando Spark: centelha elétrica de quatro pontas em turquesa e verde lima neon, simbolizando automação e integração de dados.</desc>
  <defs>
    <linearGradient id="spark-grad-vert" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="spark-grad-horiz" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#D4F434"/>
      <stop offset="50%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <filter id="spark-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="spark-halo" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="10" result="blur2"/>
    </filter>
  </defs>

  <!-- Halo de Fundo Elétrico -->
  <circle cx="64" cy="64" r="46" fill="#14B8A6" fill-opacity="0.18" filter="url(#spark-halo)"/>

  <!-- Trilhas de Barramento de Integração (Circuit Bus Grid) -->
  <g stroke="#00D4FF" stroke-width="1.2" stroke-linecap="round" opacity="0.45">
    <path d="M 16 64 L 38 64 M 90 64 L 112 64"/>
    <path d="M 64 16 L 64 38 M 64 90 L 64 112"/>
    <path d="M 26 26 L 42 42 M 86 86 L 102 102"/>
    <path d="M 102 26 L 86 42 M 42 86 L 26 102"/>
  </g>

  <!-- Anel de Transmissão de Webhook / Event Bus -->
  <circle cx="64" cy="64" r="46" stroke="#D4F434" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6"/>

  <!-- Centelha de 4 Pontas Menor Secundária (Giro 45°) -->
  <path d="M 64 32 Q 64 64, 96 64 Q 64 64, 64 96 Q 64 64, 32 64 Q 64 64, 64 32 Z" fill="#D4F434" opacity="0.4" filter="url(#spark-glow)"/>

  <!-- Centelha Primária de 4 Pontas (Corpo Elétrico Estelar) -->
  <g filter="url(#spark-glow)">
    <path d="M 64 14 Q 64 64, 114 64 Q 64 64, 64 114 Q 64 64, 14 64 Q 64 64, 64 14 Z" fill="url(#spark-grad-vert)"/>
  </g>

  <!-- Crista Central de Pulso -->
  <path d="M 64 24 Q 64 64, 104 64 Q 64 64, 64 104 Q 64 64, 24 64 Q 64 64, 64 24 Z" fill="none" stroke="#CCFBF1" stroke-width="1.8"/>

  <!-- Núcleo de Disparo do Gatilho (Trigger Core) -->
  <circle cx="64" cy="64" r="9" fill="#0D0D0D" stroke="#D4F434" stroke-width="2" filter="url(#spark-glow)"/>
  <circle cx="64" cy="64" r="4" fill="#D4F434" filter="url(#spark-glow)"/>
  <circle cx="62" cy="62" r="1.5" fill="#FFFFFF"/>

  <!-- Terminais de Conexão (APIs / Webhooks) -->
  <circle cx="16" cy="64" r="3" fill="#00F2FE" filter="url(#spark-glow)"/>
  <circle cx="112" cy="64" r="3" fill="#00F2FE" filter="url(#spark-glow)"/>
  <circle cx="64" cy="16" r="3" fill="#D4F434" filter="url(#spark-glow)"/>
  <circle cx="64" cy="112" r="3" fill="#D4F434" filter="url(#spark-glow)"/>

  <circle cx="26" cy="26" r="2.5" fill="#14B8A6"/>
  <circle cx="102" cy="102" r="2.5" fill="#14B8A6"/>
</svg>