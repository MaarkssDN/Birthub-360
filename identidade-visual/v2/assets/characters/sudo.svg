<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="sudo-title sudo-desc">
  <title id="sudo-title">Sudo — Controlador de Sistema</title>
  <desc id="sudo-desc">Avatar não-humano representando Sudo: monólito criptográfico e escudo isométrico em ardósia, ciano e ouro neon, simbolizando controle de sistema e governança.</desc>
  <defs>
    <linearGradient id="sudo-facet-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="sudo-facet-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="sudo-facet-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="sudo-gold-seal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="sudo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="sudo-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur2"/>
    </filter>
  </defs>

  <!-- Halo de Fundo de Governança -->
  <polygon points="64,14 106,36 106,92 64,114 22,92 22,36" fill="#00D4FF" fill-opacity="0.14" filter="url(#sudo-halo)"/>

  <!-- Perímetro de Segurança de Alçadas (Laser Shield Ring) -->
  <polygon points="64,12 110,36 110,92 64,116 18,92 18,36" stroke="#00D4FF" stroke-width="1.8" stroke-dasharray="5 7" opacity="0.65"/>

  <!-- Monólito Criptográfico Isométrico (Cubo de Poder) -->
  <!-- Topo do Monólito -->
  <polygon points="64,24 98,42 64,60 30,42" fill="url(#sudo-facet-top)" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Lado Esquerdo -->
  <polygon points="30,42 64,60 64,102 30,84" fill="url(#sudo-facet-left)" stroke="#64748B" stroke-width="1"/>
  <!-- Lado Direito -->
  <polygon points="64,60 98,42 98,84 64,102" fill="url(#sudo-facet-right)" stroke="#475569" stroke-width="1"/>

  <!-- Trilhas de Barramento de Autorização (Bisel Luminoso) -->
  <g filter="url(#sudo-glow)">
    <line x1="64" y1="24" x2="64" y2="60" stroke="#00D4FF" stroke-width="2"/>
    <line x1="30" y1="42" x2="64" y2="60" stroke="#00D4FF" stroke-width="1.5"/>
    <line x1="98" y1="42" x2="64" y2="60" stroke="#00D4FF" stroke-width="1.5"/>
    <line x1="64" y1="60" x2="64" y2="102" stroke="#00D4FF" stroke-width="2"/>
  </g>

  <!-- Trava Quântica Central / Fechadura de Sistema (Selo Dourado) -->
  <circle cx="64" cy="60" r="14" fill="#0D0D0D" stroke="url(#sudo-gold-seal)" stroke-width="2.5" filter="url(#sudo-glow)"/>
  
  <!-- Ícone da Chave de Comando / Cadeado Hexagonal -->
  <path d="M 64 52 L 69 55 L 69 65 L 64 68 L 59 65 L 59 55 Z" fill="#00D4FF" opacity="0.9" filter="url(#sudo-glow)"/>
  <circle cx="64" cy="59" r="2" fill="#0D0D0D"/>
  <line x1="64" y1="61" x2="64" y2="64" stroke="#0D0D0D" stroke-width="1.2"/>

  <!-- Nós de Auditoria / RBAC nos Vértices -->
  <circle cx="64" cy="12" r="3.5" fill="#FFC107" filter="url(#sudo-glow)"/>
  <circle cx="64" cy="12" r="1.5" fill="#FFFFFF"/>

  <circle cx="110" cy="36" r="3" fill="#00D4FF" filter="url(#sudo-glow)"/>
  <circle cx="110" cy="92" r="3" fill="#00D4FF" filter="url(#sudo-glow)"/>

  <circle cx="64" cy="116" r="3.5" fill="#FFC107" filter="url(#sudo-glow)"/>
  <circle cx="64" cy="116" r="1.5" fill="#FFFFFF"/>

  <circle cx="18" cy="92" r="3" fill="#00D4FF" filter="url(#sudo-glow)"/>
  <circle cx="18" cy="36" r="3" fill="#00D4FF" filter="url(#sudo-glow)"/>
</svg>