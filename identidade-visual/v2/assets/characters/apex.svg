<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="apex-title apex-desc">
  <title id="apex-title">Apex — Diretor Executivo IA</title>
  <desc id="apex-desc">Avatar não-humano representando Apex: cume triplo de decisão executiva com estrela de topo e base de alçada.</desc>
  <defs>
    <linearGradient id="apex-peak-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="55%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="apex-edge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B7DFF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#FACC15" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF2D9B" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="apex-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="apex-halo-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="46" fill="#FACC15" fill-opacity="0.13" filter="url(#apex-halo-blur)"/>

  <!-- Três cumes (hierarquia de alçada) -->
  <g filter="url(#apex-glow)">
    <path d="M 18 92 L 40 62 L 62 92 Z" fill="url(#apex-peak-grad)" opacity="0.55"/>
    <path d="M 46 92 L 74 48 L 102 92 Z" fill="url(#apex-peak-grad)"/>
    <path d="M 74 92 L 96 66 L 118 92 Z" fill="url(#apex-peak-grad)" opacity="0.55"/>
  </g>

  <!-- Linhas de cumeeira luminosas -->
  <g stroke="url(#apex-edge-grad)" stroke-width="2.6" stroke-linecap="round" fill="none">
    <line x1="40" y1="62" x2="74" y2="48"/>
    <line x1="74" y1="48" x2="96" y2="66"/>
    <line x1="40" y1="62" x2="46" y2="92"/>
    <line x1="96" y1="66" x2="102" y2="92"/>
  </g>

  <!-- Estrela de topo executivo -->
  <g filter="url(#apex-glow)">
    <path d="M 74 30 L 76.5 37 L 84 37.5 L 78.5 42.5 L 80.5 49.5 L 74 46 L 67.5 49.5 L 69.5 42.5 L 64 37.5 L 71.5 37 Z" fill="#FFF3B0" stroke="#FACC15" stroke-width="1.4"/>
  </g>

  <!-- Base de alçada -->
  <rect x="30" y="92" width="68" height="7" rx="3.5" fill="#0D0D0D" stroke="#8B7DFF" stroke-width="1.6" opacity="0.9"/>
  <circle cx="64" cy="95.5" r="2.4" fill="#FF2D9B"/>
</svg>
