<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="scope-title scope-desc">
  <title id="scope-title">Scope — Diagnóstico SDR</title>
  <desc id="scope-desc">Avatar não-humano representando Scope: retículo de diagnóstico com pulso vital e anéis de varredura de maturidade.</desc>
  <defs>
    <radialGradient id="scope-core-grad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ECFCCB"/>
      <stop offset="45%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </radialGradient>
    <linearGradient id="scope-reticle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#8B7DFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="scope-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="scope-halo-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="46" fill="#A3E635" fill-opacity="0.13" filter="url(#scope-halo-blur)"/>

  <!-- Anel externo -->
  <circle cx="64" cy="64" r="40" stroke="url(#scope-reticle-grad)" stroke-width="3" fill="none" filter="url(#scope-glow)"/>
  <circle cx="64" cy="64" r="33" stroke="#8B7DFF" stroke-width="1.2" stroke-dasharray="10 7" opacity="0.65"/>

  <!-- Retículo -->
  <g stroke="#A3E635" stroke-width="2.6" stroke-linecap="round" opacity="0.9">
    <line x1="64" y1="30" x2="64" y2="44"/>
    <line x1="64" y1="84" x2="64" y2="98"/>
    <line x1="30" y1="64" x2="44" y2="64"/>
    <line x1="84" y1="64" x2="98" y2="64"/>
  </g>

  <!-- Pulso vital (polyline) -->
  <path d="M 40 64 L 52 64 L 56 52 L 62 76 L 68 58 L 74 64 L 88 64" stroke="#00D4FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#scope-glow)"/>

  <!-- Centro diagnóstico -->
  <circle cx="64" cy="64" r="10" fill="url(#scope-core-grad)" filter="url(#scope-glow)"/>
  <circle cx="64" cy="64" r="4" fill="#0D0D0D"/>
  <circle cx="62" cy="62" r="1.6" fill="#A3E635"/>
</svg>
