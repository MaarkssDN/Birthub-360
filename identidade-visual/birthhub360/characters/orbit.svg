<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="orbit-title orbit-desc">
  <title id="orbit-title">Orbit — Guardião do CRM</title>
  <desc id="orbit-desc">Avatar não-humano representando Orbit: núcleo esférico dourado com anel orbital giroscópico e pulso ciano.</desc>
  <defs>
    <!-- Gradiente do Núcleo -->
    <radialGradient id="orbit-core-grad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#FFC107"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
    <!-- Gradiente do Anel Principal -->
    <linearGradient id="orbit-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#FFC107" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#FF2D9B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Gradiente do Equador Secundário -->
    <linearGradient id="orbit-inner-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFC107" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.8"/>
    </linearGradient>
    <!-- Glow Suave -->
    <filter id="orbit-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="orbit-deep-halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
    </filter>
  </defs>

  <!-- Halo de Fundo -->
  <circle cx="64" cy="64" r="46" fill="#FFC107" fill-opacity="0.15" filter="url(#orbit-deep-halo)"/>

  <!-- Anel Orbital Traseiro -->
  <g opacity="0.6">
    <ellipse cx="64" cy="64" rx="54" ry="20" transform="rotate(-28 64 64)" stroke="url(#orbit-ring-grad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.5"/>
  </g>

  <!-- Núcleo Central: Esfera Gravitacional -->
  <circle cx="64" cy="64" r="28" fill="url(#orbit-core-grad)" filter="url(#orbit-glow)"/>

  <!-- Atmosfera Interna / Anéis de Relevo -->
  <circle cx="64" cy="64" r="22" stroke="#FFF3B0" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="14 10"/>
  <circle cx="64" cy="64" r="16" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Foco Central / Lente do Guardião -->
  <circle cx="64" cy="64" r="7" fill="#0D0D0D" stroke="#00D4FF" stroke-width="2"/>
  <circle cx="62" cy="62" r="2.5" fill="#00D4FF"/>

  <!-- Anel Orbital Dianteiro Principal (Giroscópio) -->
  <g filter="url(#orbit-glow)">
    <ellipse cx="64" cy="64" rx="52" ry="19" transform="rotate(-28 64 64)" stroke="url(#orbit-ring-grad)" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Satélites de Dados Orbitais -->
  <!-- Satélite 1: Dourado -->
  <circle cx="21" cy="41" r="4.5" fill="#FFC107" filter="url(#orbit-glow)"/>
  <circle cx="21" cy="41" r="2" fill="#FFFFFF"/>
  <!-- Satélite 2: Ciano -->
  <circle cx="107" cy="87" r="4" fill="#00D4FF" filter="url(#orbit-glow)"/>
  <circle cx="107" cy="87" r="1.5" fill="#FFFFFF"/>
  <!-- Satélite 3: Rosa Neon -->
  <circle cx="86" cy="36" r="3" fill="#FF2D9B" filter="url(#orbit-glow)"/>

  <!-- Arco de Varredura / Radar 360 -->
  <path d="M 64 36 A 28 28 0 0 1 92 64" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <circle cx="92" cy="64" r="2" fill="#00D4FF"/>
</svg>