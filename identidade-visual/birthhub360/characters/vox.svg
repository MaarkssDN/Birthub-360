<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="vox-title vox-desc">
  <title id="vox-title">Vox — Agente de Voz</title>
  <desc id="vox-desc">Avatar não-humano representando Vox: diamante emissor de voz com arcos direcionais de fala e núcleo de sinal.</desc>
  <defs>
    <radialGradient id="vox-core-grad" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FDF4FF"/>
      <stop offset="45%" stop-color="#F0ABFC"/>
      <stop offset="100%" stop-color="#A21CAF"/>
    </radialGradient>
    <linearGradient id="vox-wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#F0ABFC" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF2D9B" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="vox-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="vox-halo-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="46" fill="#F0ABFC" fill-opacity="0.14" filter="url(#vox-halo-blur)"/>

  <!-- Arcos direcionais de emissão (direita) -->
  <g stroke="url(#vox-wave-grad)" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#vox-glow)">
    <path d="M 84 50 A 30 30 0 0 1 84 78"/>
    <path d="M 94 40 A 46 46 0 0 1 94 88" opacity="0.65"/>
    <path d="M 104 30 A 62 62 0 0 1 104 98" opacity="0.4"/>
  </g>

  <!-- Diamante emissor -->
  <g filter="url(#vox-glow)">
    <path d="M 64 32 L 88 64 L 64 96 L 40 64 Z" fill="url(#vox-core-grad)"/>
    <path d="M 64 32 L 88 64 L 64 96 M 40 64 L 88 64" stroke="#FDF4FF" stroke-width="1.2" opacity="0.6" fill="none"/>
  </g>

  <!-- Núcleo de sinal -->
  <circle cx="64" cy="64" r="11" fill="#0D0D0D" stroke="#F0ABFC" stroke-width="2.4"/>
  <circle cx="64" cy="64" r="4" fill="#F0ABFC"/>
  <circle cx="61" cy="61" r="1.4" fill="#FFFFFF"/>

  <!-- Micro-pontos de cadência à esquerda -->
  <g fill="#00D4FF" filter="url(#vox-glow)">
    <circle cx="26" cy="56" r="2.6"/>
    <circle cx="20" cy="64" r="3.4"/>
    <circle cx="26" cy="72" r="2.6"/>
  </g>
</svg>
