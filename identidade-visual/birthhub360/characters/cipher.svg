<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none" role="img" aria-labelledby="cipher-title cipher-desc">
  <title id="cipher-title">Cipher — Guardião Bitrix24</title>
  <desc id="cipher-desc">Avatar não-humano representando Cipher: anéis hexagonais entrelaçados de sincronização com chave de integridade central.</desc>
  <defs>
    <linearGradient id="cipher-ring-a-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFC107" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="cipher-ring-b-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#6EE7B7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="cipher-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cipher-halo-blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="46" fill="#6EE7B7" fill-opacity="0.13" filter="url(#cipher-halo-blur)"/>

  <!-- Anel hexagonal A (recuado) -->
  <g filter="url(#cipher-glow)" opacity="0.85">
    <polygon points="64,30 88,47 88,81 64,98 40,81 40,47" fill="none" stroke="url(#cipher-ring-a-grad)" stroke-width="4"/>
  </g>

  <!-- Anel hexagonal B (avançado, rotacionado) -->
  <g filter="url(#cipher-glow)">
    <polygon points="64,36 84,50 84,78 64,92 44,78 44,50" fill="none" stroke="url(#cipher-ring-b-grad)" stroke-width="4" transform="rotate(30 64 64)"/>
  </g>

  <!-- Nós de engrenagem nos vértices -->
  <g fill="#FFC107" filter="url(#cipher-glow)">
    <circle cx="64" cy="32" r="3.4"/>
    <circle cx="86" cy="46" r="3.4"/>
    <circle cx="86" cy="82" r="3.4"/>
    <circle cx="64" cy="96" r="3.4"/>
    <circle cx="42" cy="82" r="3.4"/>
    <circle cx="42" cy="46" r="3.4"/>
  </g>

  <!-- Chave de integridade central -->
  <circle cx="64" cy="64" r="14" fill="#0D0D0D" stroke="#6EE7B7" stroke-width="2.6" filter="url(#cipher-glow)"/>
  <circle cx="64" cy="64" r="14" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="5 5" opacity="0.7"/>
  <path d="M 58 64 L 63 69 L 71 57" stroke="#6EE7B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="64" cy="64" r="3" fill="#FFC107"/>
</svg>
