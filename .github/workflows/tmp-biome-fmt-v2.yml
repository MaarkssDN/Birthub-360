name: tmp-biome-fmt-v2

on:
  push:
    branches: [fix/onda7-biome-format-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onda7-biome-format-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome format (2.6.8)
        run: npx biome format --write src
      - name: Commit formatted files
        run: |
          git config user.name "devin-ci-fmt"
          git config user.email "devin-ci-fmt@localhost"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to format"
          else
            git commit -m "style: aplicar biome format 2.6.8 nos arquivos v2 da onda design"
            git push origin HEAD:fix/onda7-biome-format-v2
          fi
