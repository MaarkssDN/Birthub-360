name: Governance Enforcement
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-agent-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar Nome da Branch (agente/NN-slug)
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ ! "$BRANCH_NAME" =~ ^agente/[0-9]{2}-.+$ ]] && [[ ! "$BRANCH_NAME" =~ ^integracao/onda-[0-9]+$ ]]; then
            echo "Erro: A branch '$BRANCH_NAME' não segue o padrão 'agente/NN-slug' ou 'integracao/onda-N'."
            exit 1
          fi

      - name: Validar Ficheiros Modificados vs. Matriz de Propriedade
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ "$BRANCH_NAME" =~ ^agente/([0-9]{2}) ]]; then
            AGENT_ID="${BASH_REMATCH[1]}"
            echo "A verificar propriedade para o Agente $AGENT_ID..."
            # Aqui entraria um script NodeJS/Python que lê a MATRIZ_PROPRIEDADE.md 
            # e cruza com a saída de `git diff --name-only origin/main...HEAD`.
            # Se encontrar caminhos não autorizados e não for o Agente 00, bloqueia.
          fi

      - name: Verificar Parecer do Agente 09 (Auditoria)
        run: |
          # Procura na pasta .agents/reviews por um ficheiro referente a esta PR com status APROVADO
          # O script exige que a hashtag/commit da aprovação bata com o commit atual da PR.
          echo "Implementação futura: Garantir que o review bate com o hash HEAD."
