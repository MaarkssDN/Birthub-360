name: Publish private container image

# Gate: publicar a imagem só depois que o workflow canônico de release (ci.yml, "Central Birth Hub 360
# Release") tiver passado no mesmo commit de main — antes disso, push:main disparava a publicação
# incondicionalmente, sem nenhum teste/scan rodar primeiro (achado HIGH da auditoria de
# release-readiness). workflow_dispatch continua disponível para publicação manual, mas agora exige
# um SHA explícito e reprova o mesmo gate do caminho automático (Onda 10.2, PROMPT 10.2: "NO CI
# PASS = NO DEPLOY", sem exceção para disparo manual — antes desta mudança, workflow_dispatch
# publicava a imagem sem checar CI nenhum).
on:
  # Desacoplado de workflow_run automático em conformidade com a política LOCAL_FIRST.md
  # e handoffs 00-para-08-politica-publicacao-ghcr.md / DEBT-20261014-GOV-002.
  # A publicação de imagem no GHCR ocorre estritamente sob demanda autorizada via workflow_dispatch.
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA completo (40 chars) já aprovado pelo CI a publicar.'
        required: true
        type: string
      allow-unsigned-commit:
        description: >-
          Override explícito e auditado (TAREFA-SANEAMENTO-027): permite publicar um
          commit cuja assinatura NÃO é verificada pelo GitHub. Fica registrado no run.
          Use somente com justificativa — o default é bloquear.
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  # Só um publish por vez (Onda 10.2, secao 18) — evita duas execuções empurrando tags
  # conflitantes para o mesmo registry ao mesmo tempo.
  group: docker-publish
  cancel-in-progress: false

jobs:
  resolve-sha:
    name: Resolver SHA e validar CI (NO CI PASS = NO DEPLOY)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: resolve
        # Input do dispatch passa por env (nunca interpolado direto no shell) — evita injeção.
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::DEPLOY BLOCKED — SHA inválido. Informe o commit SHA completo (40 caracteres hex minúsculos)."
            exit 1
          fi
          echo "sha=${INPUT_SHA}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/require-ci-green
        with:
          sha: ${{ steps.resolve.outputs.sha }}
          check-name: build

      # TAREFA-SANEAMENTO-027 / BT360-DT-0050 — gate criptográfico de release.
      # Duas verificações independentes antes de qualquer build/push:
      #   1) tags de release (v* ou release/*) que apontam para o SHA precisam ser
      #      ANOTADAS (objeto tag) — tag lightweight aponta direto para o commit e
      #      não carrega metadado de quem/quando assinou a release;
      #   2) o commit precisa ter assinatura verificada pelo GitHub
      #      (commit.verification.verified), salvo override explícito por dispatch.
      - name: Integridade de release — tags anotadas no SHA
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          mapfile -t release_tags < <(git tag --points-at "$TARGET_SHA" | grep -E '^(v[0-9]|release/)' || true)
          if [ "${#release_tags[@]}" -eq 0 ]; then
            echo "Nenhuma tag de release (v* ou release/*) aponta para $TARGET_SHA — nada a validar em tags."
            exit 0
          fi
          status=0
          for tag in "${release_tags[@]}"; do
            object_type="$(git cat-file -t "$tag")"
            if [ "$object_type" != "tag" ]; then
              echo "::error::DEPLOY BLOCKED — tag de release '$tag' é lightweight (objeto '$object_type'). Tags de release devem ser anotadas (git tag -a -s) para preservar integridade do histórico."
              status=1
            else
              echo "Tag '$tag' é anotada (objeto tag)."
            fi
          done
          exit "$status"

      - name: Integridade de release — assinatura do commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TARGET_SHA: ${{ steps.resolve.outputs.sha }}
          ALLOW_UNSIGNED: ${{ inputs.allow-unsigned-commit }}
        with:
          script: |
            const sha = process.env.TARGET_SHA;
            const allowUnsigned = process.env.ALLOW_UNSIGNED === 'true';
            const { data } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });
            const verification = data.commit.verification || {};
            core.info(`Commit ${sha} — verification.verified=${verification.verified} reason=${verification.reason}`);
            if (verification.verified === true) {
              core.info('Commit com assinatura verificada pelo GitHub — gate de assinatura aprovado.');
              return;
            }
            if (allowUnsigned) {
              core.warning(
                `DEPLOY liberado por override explícito allow-unsigned-commit — ` +
                `commit ${sha} NÃO verificado (reason=${verification.reason}). Fica registrado neste run.`
              );
              return;
            }
            core.setFailed(
              `DEPLOY BLOCKED — commit ${sha} sem assinatura verificada pelo GitHub ` +
              `(reason=${verification.reason}). Assine o commit de release ou dispare ` +
              `novamente com allow-unsigned-commit=true de forma consciente e justificada.`
            );

  publish:
    needs: resolve-sha
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-sha.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deployment — Birth Hub 360º"
            echo '```'
            echo "ENVIRONMENT............. ghcr.io (image publish)"
            echo "COMMIT SHA............... ${{ needs.resolve-sha.outputs.sha }}"
            echo "CI QUALITY GATE........... PASS (validado no job resolve-sha antes de qualquer build)"
            echo "ARTIFACT.................. ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            echo "ACTOR...................... ${{ github.actor }}"
            echo "TIMESTAMP.................. $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "DEPLOYMENT.................. ${{ job.status }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"