name: Git Branch Hygiene

# TAREFA-SANEAMENTO-025 / BT360-DT-0048 — governança de branches remotas.
#
# - schedule (semanal) e workflow_dispatch rodam sempre em modo `audit`: somente
#   leitura + relatório (artefato e step summary). Nenhuma branch é tocada.
# - modo `clean` existe apenas via workflow_dispatch manual e exige o input
#   `confirm` = "DELETE-MERGED-BRANCHES". Mesmo assim, o script
#   scripts/git/branch-hygiene.mjs só deleta branches que sejam TODAS as
#   condições: mergeadas em main, inativas > 30 dias, sem PR aberto, fora de
#   main/master/develop e fora da graça de `agente/*` (< 90 dias). Branches
#   `archive/*` expiradas só entram com include_archives=true.
# - Se `gh` não conseguir listar PRs abertos, o clean ABORTA (fail-closed).
#
# Ação humana pendente (não automatizável por workflow sem admin): habilitar
# "Automatically delete head branches" em Settings > General do repositório —
# ver docs/ci/BRANCH_HYGIENE.md.

on:
  schedule:
    - cron: '17 6 * * 1' # segunda-feira 06:17 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit (somente relatório) ou clean (deleta candidatas seguras)'
        required: true
        type: choice
        default: audit
        options: [audit, clean]
      include_archives:
        description: 'clean: incluir archive/* expiradas (>180d) na deleção'
        required: false
        type: boolean
        default: false
      confirm:
        description: 'Obrigatório "DELETE-MERGED-BRANCHES" para o modo clean'
        required: false
        type: string
        default: ''

permissions:
  # `contents: write` só é exercido no modo clean (git push origin --delete).
  # O job de audit nunca escreve; a permissão ampla é o preço de um único job
  # que atende aos dois modos sem duplicar checkout/fetch de 400+ branches.
  contents: write

concurrency:
  group: git-branch-hygiene
  cancel-in-progress: false

jobs:
  hygiene:
    name: Auditar / limpar branches remotas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Rodar branch-hygiene
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode || 'audit' }}
          INCLUDE_ARCHIVES: ${{ inputs.include_archives || false }}
          CONFIRM: ${{ inputs.confirm || '' }}
        run: |
          set -euo pipefail
          args=(--json-out branch-hygiene-report.json --summary-out branch-hygiene-summary.md)
          if [ "$MODE" = "clean" ]; then
            args=(clean --confirm "$CONFIRM" "${args[@]}")
            if [ "$INCLUDE_ARCHIVES" = "true" ]; then
              args+=(--include-archives)
            fi
          else
            args=(audit "${args[@]}")
          fi
          node scripts/git/branch-hygiene.mjs "${args[@]}"

      - name: Publicar relatório no Step Summary
        if: always()
        run: |
          if [ -f branch-hygiene-summary.md ]; then
            cat branch-hygiene-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório não gerado (falha antes da auditoria)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload relatório JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branch-hygiene-report
          path: branch-hygiene-report.json
          if-no-files-found: warn
