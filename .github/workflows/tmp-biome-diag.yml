name: tmp-biome-diag

# TEMPORÁRIO: triagem dos 7 erros do biome 2.6.8 após upgrade do dependabot.
# Remover após revelar o diagnóstico completo (lint:ci já roda com
# --diagnostic-level=error no commit anterior, mas o job do gate demora ~45min
# para liberar o log; este workflow isolado responde em ~2min).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: biome lint (somente erros)
        run: npx -y @biomejs/biome@2.6.8 lint src --diagnostic-level=error --max-diagnostics=none
