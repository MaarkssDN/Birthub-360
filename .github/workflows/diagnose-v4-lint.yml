name: Diagnose V4 Lint Gate (temporary)
on:
  push:
    branches:
      - fix/landing-v4-lint-diagnostics-20261108
    paths:
      - .github/workflows/diagnose-v4-lint.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Show errors only (no changes)
        run: npm exec --yes --package=@biomejs/biome@2.5.14 -- biome lint src --diagnostic-level=error --max-diagnostics=50
