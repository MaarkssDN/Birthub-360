name: tmp-biome-fmt

# TEMPORÁRIO: aplica `biome format --write src` no runner (biome 2.6.8) e sobe
# o diff como artifact — contorna o bloqueio de Device Guard que impede rodar
# o binário nativo do biome nesta máquina Windows. Remover após aplicar o patch.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: biome format --write
        run: npx -y @biomejs/biome@2.6.8 format --write src
      - name: extrair patch
        run: git diff > biome-format.patch && wc -l biome-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: biome-format-patch
          path: biome-format.patch
          if-no-files-found: error
