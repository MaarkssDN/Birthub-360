name: Schemathesis API Fuzzing Gate

# MEL-39: Property-based API fuzzing gate derivado de docs/openapi.yaml via Schemathesis.
# Roda em duas cadências:
# 1. PRs com alterações em docs/openapi.yaml ou rotas de API (smoke fuzzing rápido para 5xx).
# 2. Execução noturna agendada (cron) e sob demanda (workflow_dispatch) para fuzzing profundo.

on:
  pull_request:
    paths:
      - 'docs/openapi.yaml'
      - 'src/server/**'
      - 'src/routes/**'
      - '.github/workflows/schemathesis-fuzzing.yml'
  schedule:
    - cron: '0 4 * * *' # Diariamente às 04:00 UTC
  workflow_dispatch:
    inputs:
      hypothesis_max_examples:
        description: 'Número de exemplos Hypothesis por endpoint'
        default: '30'
        required: false
      checks:
        description: 'Validações ativas no Schemathesis (separadas por vírgula)'
        default: 'not_a_server_error'
        required: false

permissions:
  contents: read

concurrency:
  group: schemathesis-fuzzing-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  schemathesis-fuzz:
    name: Schemathesis API Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prospector
          POSTGRES_PASSWORD: prospector_test_pass
          POSTGRES_DB: prospectordb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U prospector -d prospectordb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -h 127.0.0.1 ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: ci-test-meili-key
        ports:
          - 7700:7700
        options: >-
          --health-cmd "wget --no-verbose --tries=1 -O - http://127.0.0.1:7700/health >/dev/null 2>&1 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-start-period 30s
          --health-retries 12

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://prospector_app:ci_app_test_pass@localhost:5434/prospectordb_test?schema=public
      DIRECT_URL: postgresql://prospector_migrator:ci_migrator_test_pass@localhost:5434/prospectordb_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: ci-test-meili-key
      PORT: 3000
      BETTER_AUTH_SECRET: ci-e2e-test-only-secret-not-for-production
      BETTER_AUTH_URL: http://localhost:3000
      ALLOW_DEV_AUTH_BYPASS: true
      ALLOWED_ORIGINS: http://localhost:3000
      AUTH_RATE_LIMIT_MAX: 1000
      PLATFORM_OPERATOR_TOKEN: ci-test-operator-token-not-for-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Schemathesis
        run: pip install schemathesis

      - name: Bootstrap papel NOSUPERUSER do banco
        env:
          PGPASSWORD: prospector_test_pass
          APP_DB_PASSWORD: ci_app_test_pass
          MIGRATOR_DB_PASSWORD: ci_migrator_test_pass
        run: bash scripts/db/bootstrap-app-role.sh localhost 5434 prospector prospectordb_test

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Migrations
        run: npx prisma migrate deploy

      - name: Re-bootstrap pós-migrate
        env:
          PGPASSWORD: prospector_test_pass
          APP_DB_PASSWORD: ci_app_test_pass
          MIGRATOR_DB_PASSWORD: ci_migrator_test_pass
        run: bash scripts/db/bootstrap-app-role.sh localhost 5434 prospector prospectordb_test

      - name: Build Application
        run: npm run build

      - name: Start Express API Server
        run: |
          node dist/server.cjs &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          echo "Aguardando inicialização da API..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health/live >/dev/null 2>&1; then
              echo "API operacional após ${i}s."
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health/live || { echo "Falha ao iniciar servidor"; kill -9 $SERVER_PID 2>/dev/null || true; exit 1; }

      - name: Run Schemathesis API Fuzzing
        env:
          EXAMPLES: ${{ inputs.hypothesis_max_examples || (github.event_name == 'schedule' && '100' || '20') }}
          CHECKS: ${{ inputs.checks || 'not_a_server_error' }}
        run: |
          schemathesis run docs/openapi.yaml \
            --url http://127.0.0.1:3000 \
            --checks $CHECKS \
            --max-examples $EXAMPLES \
            --workers 2 \
            --header "Authorization: Bearer ci-test-token" \
            --junit-xml schemathesis-results.xml

      - name: Stop Express API Server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill -15 $SERVER_PID 2>/dev/null || true
          fi

      - name: Upload Schemathesis Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schemathesis-results
          path: schemathesis-results.xml
          retention-days: 14
