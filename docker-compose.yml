# Stack local de apoio (Redis, Meilisearch, MinIO, LiteLLM, Ollama).
#
# NÃO há mais Postgres aqui, de propósito: a aplicação
# aponta DATABASE_URL DIRETAMENTE para o Postgres remoto — ver
# .env.example. O serviço antigo (porta 5434) vive em
# docker-compose.postgres-local.yml, opt-in, só para testes de integração locais e para os overlays
# opcionais que guardam metadata próprio nele (langfuse, n8n, superset...).
services:
  redis:
    # Digest pinado (2026-11-24): tag `7-alpine` é móvel; o sha256 fixa o manifest list exato.
    # Atualizar com `docker buildx imagetools inspect redis:7-alpine` e trocar o digest.
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    container_name: birthhub_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-prospector_redis_pass}
    ports:
      # Bind em 127.0.0.1: a stack é dev-local; sem isso Redis/Meili/MinIO/LiteLLM/Ollama ficam
      # alcançáveis por qualquer host da LAN. Containers do próprio compose continuam se falando
      # pela rede interna (nomes de serviço), que não passa pela porta publicada.
      - '127.0.0.1:6379:6379'
    volumes:
      - birthhub_redisdata:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD:-prospector_redis_pass} ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    # Tag `v1.6` + digest pinado (2026-11-24) para build reproduzível.
    image: getmeili/meilisearch:v1.6@sha256:634e83ffe5bad15239fa26bd04d06bccb84a1f2f06ad8a35135b510711348792
    container_name: birthhub_meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-birthhub_meili_master_key}
      - MEILI_ENV=development
    ports:
      - '127.0.0.1:7700:7700'
    volumes:
      - birthhub_meilidata:/meili_data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, não "localhost": esse wget resolve "localhost" para ::1 primeiro dentro do
      # container e não cai para IPv4 depois do connection refused, então o healthcheck falhava
      # sempre (FailingStreak crescendo indefinidamente) mesmo com o Meilisearch respondendo 200
      # normalmente em /health — confirmado rodando o mesmo comando manualmente dentro do container.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # Storage S3 local. Substitui a dependência de Supabase Storage durante o desenvolvimento.
  # MINIO_ROOT_PASSWORD usa fail-fast (${MINIO_ROOT_PASSWORD:?...}) sem senha default embutida;
  # defina MINIO_ROOT_PASSWORD num .env local não versionado. TLS não é configurado aqui de
  # propósito (uso local/dev); não reusar este compose como está para produção.
  minio:
    # O repositório elestio/minio só publica a tag `latest` (sem tags semver — verificado no
    # Docker Hub em 2026-11-24). O pin por digest é a única forma de reproduzir a mesma imagem;
    # o sha256 abaixo é o manifest list do `latest` naquele dia.
    image: elestio/minio:latest@sha256:25348a257f1ece1b192f25f6cd9854618fa86422ac87b494b5d4e629c556d4bd
    container_name: birthhub_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-birthhub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - birthhub_miniodata:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # Cria o bucket esperado pela aplicação de forma idempotente após o MinIO responder.
  minio-init:
    image: alpine:3.21
    container_name: birthhub_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl &&
      curl -O https://dl.min.io/client/mc/release/linux-amd64/mc &&
      chmod +x mc &&
      until ./mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-birthhub} ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}; do sleep 2; done;
      ./mc mb --ignore-existing local/prospector-assets;
      exit 0;
      "
    security_opt:
      - no-new-privileges:true
    restart: 'no'

  litellm:
    # Digest pinado (2026-11-24) sobre a tag móvel `main-stable` — mesmo padrão do Dockerfile.
    image: ghcr.io/berriai/litellm:main-stable@sha256:1050d2c9ca58399de9cd51df6eb503812af697717f54d2f08c1c30589c75e1f7
    container_name: birthhub_litellm
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?defina LITELLM_MASTER_KEY no .env}
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ['--config', '/app/config.yaml', '--port', '4000']
    # host.docker.internal já resolve nativamente no Docker Desktop (Windows/Mac); o mapeamento
    # explícito abaixo é só para portabilidade caso alguém rode isso num host Linux.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      # A imagem do LiteLLM não tem curl/wget instalado (só falha com "executable file not
      # found") — o healthcheck original nunca conseguia nem executar, então o container ficava
      # "unhealthy" pra sempre mesmo respondendo normalmente. Python já vem na imagem (usado pela
      # própria aplicação), então serve de cliente HTTP mínimo aqui. 127.0.0.1, não "localhost",
      # pelo mesmo motivo do healthcheck do Meilisearch acima (evita a resolução para ::1).
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    # `latest` fixado na versão semver vigente em 2026-11-24 (0.40.18, mesmo digest do latest).
    image: ollama/ollama:0.40.18
    container_name: birthhub_ollama
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - birthhub_ollamadata:/root/.ollama
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'ollama list || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Descomente abaixo para habilitar GPU Nvidia na nuvem / host Linux:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  birthhub_redisdata:
  birthhub_meilidata:
  birthhub_miniodata:
  birthhub_ollamadata:
