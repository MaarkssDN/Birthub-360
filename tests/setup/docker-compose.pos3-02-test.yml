# Harness de testes de integração ISOLADO por agente — POS3-02-ENV-HARNESS (Agente 02 — Bento).
#
# Vive em tests/setup/ de propósito: a MATRIZ_PROPRIEDADE dá `tests/setup/**` ao Agente 02;
# um docker-compose.*.yml na raiz colidiria com o guarda-chuva do Agente 93 (Squad 90/93).
#
# Substitui o par docker-compose.yml + docker-compose.postgres-local.yml para execuções de
# `vitest.integration` fora do CI, com isolamento por prefixo `pos3_02_`:
#   - containers: pos3_02_postgres / pos3_02_redis / pos3_02_meilisearch
#   - volumes:   pos3_02_pgdata / pos3_02_redisdata / pos3_02_meilidata
#   - banco de teste dedicado: prospectordb_pos3_02_test (criado pelo bootstrap script,
#     NUNCA o prospectordb de dev)
#   - Redis DB index 2 no .env.test gerado (o index 1 fica livre para a stack compartilhada)
#
# Portas públicas são as mesmas esperadas pelas suítes (.env.test.example):
#   Postgres 127.0.0.1:5434 · Redis 127.0.0.1:6379 · Meilisearch 127.0.0.1:7701
#
# ⚠️ Conflito de porta: se a stack compartilhada (docker-compose.yml +
# docker-compose.postgres-local.yml, containers birthhub_*) já estiver de pé, estes serviços
# NÃO sobem (bind 5434/6379/7701 ocupado). Escolha UM dos dois ambientes por vez — ver
# .agents/runs/pos3-02-env-harness.md (runbook).
#
# Uso (via wrapper, recomendado — rodar da raiz do repo):
#   node tests/setup/pos3-02-env-harness.mjs                 # sobe, migra, seed, roda as 3 suítes de cadência, derruba
#   node tests/setup/pos3-02-env-harness.mjs --keep-up       # sobe e mantém de pé (para iteração)
#   node tests/setup/pos3-02-env-harness.mjs --down          # derruba containers (volumes preservados)
#   node tests/setup/pos3-02-env-harness.mjs --down --purge  # derruba e apaga volumes
#
# Uso direto:
#   docker compose -f tests/setup/docker-compose.pos3-02-test.yml up -d --wait
#   docker compose -f tests/setup/docker-compose.pos3-02-test.yml down

name: pos3-02-env-harness

services:
  postgres:
    # pgvector/pgvector:pg17 com digest pinado (manifest list, consultado no Docker Hub em
    # 2026-11-26) — mesma disciplina do Redis/Meilisearch abaixo. ATENÇÃO: esta imagem NÃO
    # inclui PostGIS. As migrations do repo só exigem `vector` e `pg_trgm` (verificado em
    # prisma/migrations — nenhum uso de postgis/geography/geometry), então o initdb de
    # scripts/db/02-enable-extensions.sql (que criaria postgis) foi deliberadamente NÃO
    # montado aqui: ele existe para o Postgres local de dev, não para este harness de teste.
    # Se um dia uma migration passar a exigir postgis, trocar para build de
    # docker/postgres/Dockerfile (que instala postgresql-17-postgis-3) ou imagem com PostGIS.
    image: pgvector/pgvector:pg17@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
    container_name: pos3_02_postgres
    environment:
      # Superusuário de bootstrap — usado só para criar o banco de teste e rodar
      # create-app-role.sql (criar os papéis). A app NUNCA conecta como ele (RLS não se
      # aplica a superusuário — N1 em docs/auditoria-divida-tecnica/08-PLANO-DE-SEGURANCA.md).
      POSTGRES_USER: ${POSTGRES_USER:-prospector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prospector_pass}
      POSTGRES_DB: ${POSTGRES_DB:-prospectordb}
      # Senhas dos papéis criados por scripts/db/create-app-role.sql — defaults idênticos aos
      # do .env.test.example para o .env.test gerado pelo bootstrap funcionar sem edição.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-prospector_app_pass}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:-prospector_migrator_pass}
    ports:
      - '127.0.0.1:5434:5432'
    shm_size: '1gb'
    volumes:
      - pos3_02_pgdata:/var/lib/postgresql/data
      # Só o necessário para o initdb do banco BOOTSTRAP (prospectordb): cria os papéis
      # app/migrator via docker-init.sh → create-app-role.sql.tpl. O banco de teste
      # (prospectordb_pos3_02_test) é criado depois pelo bootstrap script, que roda o mesmo
      # create-app-role.sql.tpl nele manualmente — ver tests/setup/pos3-02-env-harness.mjs.
      # 02-enable-extensions.sql (postgis) e 03-create-langfuse-db.sql (langfuse) NÃO são
      # montados: postgis não existe nesta imagem e langfuse não é dependência das suítes.
      - ../../scripts/db/create-app-role.sql:/docker-entrypoint-initdb.d/create-app-role.sql.tpl:ro
      - ../../scripts/db/docker-init.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    security_opt:
      - no-new-privileges:true
    restart: 'no'
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-prospector} -d ${POSTGRES_DB:-prospectordb}']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    # Digest pinado idêntico ao docker-compose.yml (mesma tag móvel `7-alpine`, sha256 fixo).
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    container_name: pos3_02_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-prospector_redis_pass}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - pos3_02_redisdata:/data
    security_opt:
      - no-new-privileges:true
    restart: 'no'
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD:-prospector_redis_pass} ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 12

  # Meilisearch dedicado de teste — o .env.test.example aponta MEILI_HOST para :7701 e o
  # prepare-integration-env.js compartilhado espera esse endpoint. Os testes de integração
  # mockam o client (tests/helpers/integration-setup.ts), mas manter o serviço evita falhas
  # em qualquer caminho que escape do mock. Senha = MEILI_MASTER_KEY do .env.test.example.
  meilisearch:
    image: getmeili/meilisearch:v1.6@sha256:634e83ffe5bad15239fa26bd04d06bccb84a1f2f06ad8a35135b510711348792
    container_name: pos3_02_meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-birthhub360_meili_master_key_test}
      - MEILI_ENV=development
      - MEILI_NO_ANALYTICS=true
    ports:
      - '127.0.0.1:7701:7700'
    volumes:
      - pos3_02_meilidata:/meili_data
    security_opt:
      - no-new-privileges:true
    restart: 'no'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:7700/health']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pos3_02_pgdata:
  pos3_02_redisdata:
  pos3_02_meilidata:
