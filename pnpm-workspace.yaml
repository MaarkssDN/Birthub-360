allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  '@whiskeysockets/baileys': true
  bcrypt: true
  core-js: true
  cpu-features: true
  esbuild: true
  libxmljs2: true
  msgpackr-extract: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true
  ssh2: true
  tesseract.js: true
minimumReleaseAgeExclude:
  - posthog-js@1.434.9
# Espelho de `overrides` do package.json: o npm é o gerenciador oficial do CI, mas o pnpm não lê
# aquele campo — sem este espelho o pnpm-lock.yaml resolve versões transitivas antigas
# (protobufjs 6.x, sharp 0.32.x, mysql2 3.15.x) e o gate de PR do Trivy reporta HIGH/CRITICAL em
# um lockfile que nenhum ambiente instala. Ao mudar `overrides` no package.json, atualize aqui.
overrides:
  deepmerge-ts: ^8.0.2
  brace-expansion: ^2.0.1
  uuid: ^14.0.2
  fast-uri: ^3.1.7
  '@xenova/transformers>sharp': ^0.35.3
  protobufjs: 7.6.5
  lodash: ^4.17.24
  react-router: '>=7.18.0'
  js-yaml: ^4.1.0
  'xcode>uuid': '>=11.1.1'
  'openai>zod': $zod
  mysql2: ^3.22.0
  qs: ^6.16.0
  'mammoth>@xmldom/xmldom': ^0.8.15
  '@capacitor/cli>@xmldom/xmldom': ^0.9.12
  # Pin acorn 8.11.3 - origem: merge 0c4fe2fd (2026-10-04, branch agente/08-waiver-ghsa-ch52),
  # sem justificativa registrada no commit nem em docs/security/AUDIT_WAIVERS.md.
  # GHSA-CH52-4W7C-C8XP NAO afeta acorn (era http-cache-semantics <=4.2.0; advisory hoje
  # "Withdrawn"; waiver removido em 985d8586). Unico advisory de acorn (GHSA-6chw-6frg-f759)
  # afeta so <5.7.4/6.4.1/7.1.1; OSV/GHSA sem vulns para 8.11.3 nem 8.18.0.
  # Criterio para remover: decisao do Agente 00/dono confirmando que nao ha motivo de
  # compatibilidade, e build + testes verdes sem o pin (npm ja resolve 8.18.0).
  acorn: 8.11.3
