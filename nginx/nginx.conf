# Configuração Principal Nginx — Birth Hub 360
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting de borda (TAREFA-SANEAMENTO-029 / BT360-DT-0057): zonas por IP
    # de origem, aplicadas em birthhub360.conf. Chave = $binary_remote_addr —
    # este nginx é a borda pública do app; se um dia entrar atrás de CDN/LB,
    # configurar real_ip_header/real_ip_recursive ANTES destes limites para não
    # agregar todo o tráfego no IP do proxy.
    # birthhub_req: limite geral por IP (flood/DoS bruto).
    # birthhub_auth: limite apertado para /api/auth/* (força bruta/credential
    # stuffing) — mais restritivo que o authLimiter da aplicação, que segue
    # existindo como segunda camada semântica.
    # birthhub_conn: teto de conexões simultâneas por IP.
    limit_req_zone $binary_remote_addr zone=birthhub_req:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=birthhub_auth:10m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=birthhub_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    include /etc/nginx/conf.d/*.conf;
    include /home/ubuntu/birthhub-360/nginx/birthhub360.conf;
}
